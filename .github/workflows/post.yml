name: Threads 自動投稿

on:
  schedule:
    - cron: "7 * * * *"  # 1時間おきにチェック（投稿するかは schedule.json で判定）
  workflow_dispatch:
    inputs:
      force:
        description: "時間帯に関係なく今すぐ投稿する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: threads-post

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python post.py ${{ inputs.force && '--force' || '' }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 投稿済みの文章を記録
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.txt posted.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "投稿済みの文章を記録" && git pull --rebase && git push)
