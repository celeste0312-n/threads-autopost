name: 投稿時間帯の分析とトークン更新

on:
  schedule:
    - cron: "13 18 * * 0"  # 毎週月曜 3:13（日本時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: よく見られる時間帯を分析
        run: python analyze.py
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}

      - name: schedule.json を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git diff --cached --quiet || (git commit -m "投稿時間帯を更新" && git pull --rebase && git push)

      - name: Threads トークンを更新（60日の期限切れ防止）
        if: env.GH_PAT != ''
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          NEW_TOKEN=$(python -c "import threads_api; print(threads_api.refresh_token())")
          echo "::add-mask::$NEW_TOKEN"
          echo "$NEW_TOKEN" | GH_TOKEN="$GH_PAT" gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
